<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>Bingo A+ Signal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #06101a;
      color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .header {
      margin-bottom: 22px;
    }

    .title {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 7px;
      color: #8295aa;
      font-size: 14px;
    }

    .card {
      background: #0d1a27;
      border: 1px solid #20364a;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .label {
      color: #8295aa;
      font-size: 14px;
      font-weight: 700;
    }

    .next-time {
      margin-top: 7px;
      font-size: 38px;
      font-weight: 900;
    }

    .countdown {
      margin-top: 6px;
      color: #52e0b0;
      font-size: 17px;
      font-weight: 800;
    }

    .signal-card {
      text-align: center;
      padding: 26px 18px;
    }

    .signal-title {
      color: #ffcf5c;
      font-size: 17px;
      font-weight: 900;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .ball {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #13283a;
      border: 2px solid #2c4961;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
    }

    .waiting {
      margin-top: 18px;
      color: #8295aa;
      font-size: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .status-value {
      font-weight: 900;
    }

    .offline {
      color: #ff6b78;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #0d1a27;
      border: 1px solid #20364a;
      border-radius: 18px;
      padding: 17px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 900;
      margin-top: 7px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      background: #16a879;
      color: white;
      font-size: 17px;
      font-weight: 900;
    }

    .footer {
      text-align: center;
      color: #52687d;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">BINGO A+ SIGNAL</div>
    <div class="subtitle">最新 50 期・A+ 圖形訊號掃描</div>
  </div>

  <div class="card">
    <div class="label">下一期</div>
    <div class="next-time" id="nextTime">--:--</div>
    <div class="countdown" id="countdown">計算中...</div>
  </div>

  <div class="card signal-card">
    <div class="signal-title">🔥 A+ 強訊號</div>

    <div class="numbers">
      <div class="ball">--</div>
      <div class="ball">--</div>
      <div class="ball">--</div>
      <div class="ball">--</div>
    </div>

    <div class="waiting">
      等待最新資料與 A+ 訊號
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="label">最新 50 期資料</span>
      <span class="status-value offline">尚未連線</span>
    </div>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="label">上一期命中</div>
      <div class="stat-number">-- / --</div>
    </div>

    <div class="stat">
      <div class="label">今日 A+ 命中率</div>
      <div class="stat-number">--%</div>
    </div>

  </div>

  <button onclick="location.reload()">
    重新整理
  </button>

  <div class="footer">
    A+ 模型：左右包圍缺口＋第二訊號重疊
  </div>

</div>

<script>
function updateClock() {
  const now = new Date();

  const minute = now.getMinutes();
  const second = now.getSeconds();

  let nextMinute = Math.ceil((minute + 0.001) / 5) * 5;

  const next = new Date(now);

  if (nextMinute >= 60) {
    next.setHours(now.getHours() + 1);
    next.setMinutes(0);
  } else {
    next.setMinutes(nextMinute);
  }

  next.setSeconds(0);
  next.setMilliseconds(0);

  const diff = Math.max(0, next - now);

  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff % 60000) / 1000);

  document.getElementById("nextTime").textContent =
    next.toLocaleTimeString("zh-TW", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

  document.getElementById("countdown").textContent =
    "距離下一期 " +
    String(mins).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

updateClock();
setInterval(updateClock, 1000);
  async function loadSignal() {
  try {
    const res = await fetch("/api/signal?ts=" + Date.now(), {
      cache: "no-store"
    });

    const data = await res.json();
    const balls = document.querySelectorAll(".ball");

    if (Array.isArray(data.numbers) && data.numbers.length > 0) {
      balls.forEach((ball, i) => {
        ball.textContent = data.numbers[i] ?? "--";
      });

      const waiting = document.querySelector(".waiting");
      if (waiting) {
        waiting.textContent =
          data.level === "A+"
            ? "🔥 A+ 強訊號"
            : "等待 A+ 強訊號";
      }
    } else {
      balls.forEach(ball => {
        ball.textContent = "--";
      });
    }
  } catch (err) {
    console.log("Signal API error:", err);
  }
}

loadSignal();
setInterval(loadSignal, 5000);
</script>

</body>
</html>
