name: Bingo Super A+ v6.4 Forward Research

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bingo-super-v64-forward
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run v6.4 forward research
        run: node super_v64_research.js --days=3

      - name: Save v6.4 tracking only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add super_v64_tracking.json super_v64_report.json super_v64_rounds.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update A+ v6.4 forward research tracking"
            git push

      - name: Upload v6.4 report
        uses: actions/upload-artifact@v4
        with:
          name: v6.4-forward-report
          path: |
            super_v64_tracking.json
            super_v64_report.json
            super_v64_rounds.csv
