name: Bingo Repeat 3 vs 5 Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch complete 20-number history
        run: node fetch_history.js --days=14 --output=history.csv
      - name: Backtest 3 vs 5
        run: node repeat_backtest.js history.csv --train=200 --test=500
      - name: Save downloaded CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingo-repeat-history
          path: history.csv
          if-no-files-found: ignore
