name: Track Bingo 3-Star V2.2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: star3-v22-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest Bingo history
        run: node fetch_history.js --days=14 --output=history.csv

      - name: Run V2.2 tracking
        run: node star3_v22_track.js history.csv

      - name: Save tracking results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv star3_v22_tracking.json star3_v22_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Bingo 3-star V2.2 tracking"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
