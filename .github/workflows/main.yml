name: Bingo A+ Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Bingo Scanner
            - name: Save 12-period tracking
        run: |
          if [ -f aplus_v61_tracking.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aplus_v61_tracking.json
            if ! git diff --cached --quiet; then
              git commit -m "Update A+ v6.1 tracking"
              git push
            fi
          else
            echo "Tracking file not generated"
          fi
        run: node scanner_v61.js
